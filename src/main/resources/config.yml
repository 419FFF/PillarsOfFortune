# Pillars of Fortune
# Every options: value from the Skript lives here. Edit and /pof reload.

prefix: "&8[&6PoF&8]&r"
server-ip: example.com

worlds:
  lobby-name: world
  game-name: pof_void
  clear-lobby-weather: false

arenas:
  count: 6
  # region = clear one arena box inside the shared void world
  # world-per-arena = unload and recreate that arena's void world
  reset-mode: region
  reset-blocks-per-tick: 8000

pillars:
  count: 12
  radius: 20
  height: 45
  y: 70
  # Same offsets as the Skript (pof.tmp.ox / pof.tmp.oz)
  offsets:
    - "20,0"
    - "17,10"
    - "10,17"
    - "0,20"
    - "-10,17"
    - "-17,10"
    - "-20,0"
    - "-17,-10"
    - "-10,-17"
    - "0,-20"
    - "10,-17"
    - "17,-10"

void-y: 8
arena-size: 40
build-radius: 48
clear-radius: 72
clear-height: 120
max-build-y: 120
border-kill: 70

min-players: 2
max-players: 12
countdown: 15
queue-seconds: 30
item-seconds: 5
grace-seconds: 5
end-seconds: 8
max-game-seconds: 600
lobby-gamemode: ADVENTURE

fireball:
  speed: 10.0
  accel: 0.1
  knockback-x: 1.15
  knockback-y: 0.75
  radius: 3.0
  cooldown: 0.5
  damage-self: 0.5
  damage-enemy: 2.0

block-min: 4
block-max: 12
pearl-chance: 15
# Chance to keep an enchanted pool entry (Skript "stick of knockback" 12%)
enchant-keep-chance: 12

rates:
  weapons: 8
  armor: 7
  blocks: 72
  chaos: 13

lobby-items:
  join-material: NETHER_STAR
  join-name: "&6&lJoin Queue"
  leave-material: BARRIER
  leave-name: "&c&lLeave Queue"
  vip-material: DIAMOND
  vip-name: "&6&lStart Match"

storage:
  type: h2
  h2:
    file: data
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    user: root
    password: ""

leaderboards:
  size: 10
  refresh-ticks: 200

stats:
  playtime-online-only: true

sounds:
  queue-join: random.orb
  countdown: note.pling
  eliminated: mob.wither.hurt
  victory: random.levelup
  defeat: random.explode
  cages: mob.wither.spawn
  fight: random.levelup
  item: random.pop
  kill: random.orb
  fireball: mob.ghast.fireball

