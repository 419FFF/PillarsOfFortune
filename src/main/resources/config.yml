  won: "&6{player} &ewon Pillars of Fortune!"
  title-defeat: "&cDEFEAT"
  subtitle-defeat: "&7Winner: &e{player}"
  title-cages: "&6&lPILLARS OF FORTUNE"
  subtitle-cages: "&eCages open in {seconds}s"
  title-fight: "&6FIGHT"
  subtitle-fight: "&7Items incoming"
  grace-over: "&cGrace period over. PvP is live."
  sudden-death: "&cSudden death! Lightning on the pillars."
  action-item: "&6+ item"
  match-starting: "&eMatch starting in &f{seconds}&e seconds."
  match-starting-soon: "&eMatch starting in &f{seconds}&e seconds..."
  title-count: "&e{time}"
  subtitle-count: "&7Match starting"
  title-start-count: "&6{time}"
  subtitle-start-count: "&7Get ready"
  join-hint: "&7Right-click the &equeue item &7or type &e/pof join&7."
  join-message: "{prefix} {luckperms_prefix}&e{player} &7joined."
  quit-message: "{prefix} {luckperms_prefix}&e{player} &7left."
  restart-required: "&cA full restart is required before every arena uses the new arena or pillar settings."
  reload-waiting-only: "&eActive matches were left running. New settings apply to waiting arenas."
  storage-failed: "&cStorage reconnect failed. The previous database is still in use."
  chat-alive: "&8[&6PoF&8] {luckperms_prefix}&f{player}&8: &7{message}"
  chat-spec: "&8[&7SPEC&8] {luckperms_prefix}&8{player}&8: &7{message}"
  # The tab list is automatic. Each viewer sees only the players in their own arena, or only the
  # lobby when they are idle. There is no tab header, footer, name colour, or team ordering.
  # Sidebar: \n starts a new line, top to bottom.
  # The first line is the title (32 characters). Each line under it is 32 characters. At most 15 of those.
  # A blank line leaves a gap. {luckperms_prefix}, {luckperms_suffix}, and %placeholder% use the viewer.
  # Every mode: {ip} {wins} {kills} {deaths} {streak} {best} {games} {items} {mins} {queue} {max} {mode}
  # Title and date: {title} {date}. Leveling: {level} {level_name} {xp} {xp_next} {progress}
  # {title} is the bold line: PILLARS in the lobby, STARTING in the cage, then the mode name
  # (RUSH, CLASSIC, ...) while playing, and FINISHED at the end. {date} is MM/DD/YY.
  # Every board ends with the level right next to its {progress} bar, just above {ip}.
  # There is no blank spacer line: a line that is only a colour code shows as an empty gap.
  # {start} is board-start, or board-start-waiting while that queue is still short.
  # In a match: {id} {alive} {starts} {item} {time} {grace} {session_kills} {state} {clock}
  # {state} is already colored. {clock} is m:ss. {starts} {item} {time} {grace} are seconds.
  board-lobby: "{title}\n&7{date}\n&fWins: &e{wins}\n&fKills: &e{kills}\n&fStreak: &e{streak}\n&fLevel: {level_name} {progress}\n&e{ip}"
  board-queued: "{title}\n&7{date}\n{start}\n&fQueue: &e{queue}&7/&f{max}\n&fLevel: {level_name} {progress}\n&e{ip}"
  board-starting: "{title}\n&7{date}\n&fArena: &e{id}\n&fStarts: &e{starts}s\n&fAlive: &e{alive}\n&fLevel: {level_name} {progress}\n&e{ip}"
  board-grace: "{title}\n&7{date}\n&fArena: &e{id}\n&fAlive: &e{alive}\n&fKills: &e{session_kills}\n&fItem: &e{item}s\n&fTime: &e{time}s\n&aGrace: &f{grace}s\n&fLevel: {level_name} {progress}\n&e{ip}"
  board-ingame: "{title}\n&7{date}\n&fArena: &e{id}\n&fAlive: &e{alive}\n&fKills: &e{session_kills}\n&fItem: &e{item}s\n&fTime: &e{time}s\n&fLevel: {level_name} {progress}\n&e{ip}"
  board-ending: "{title}\n&7{date}\n&fArena: &e{id}\n&fAlive: &e{alive}\n&fKills: &e{session_kills}\n&fLevel: {level_name} {progress}\n&e{ip}"
  # {value} is the countdown in seconds. {start} inserts one of these two lines.
  board-start: "&fStart: &e{value}s"
  # Shown through {start} while the queue does not have enough players.
  board-start-waiting: "&fStart: &eWaiting for player"

# Item pools. A line is a Bukkit 1.8 material. Repeating a line makes that item more common.
# Extra options go after | and can be combined:
#   STICK|KNOCKBACK:1                 enchantment and level
#   DIAMOND_SWORD|DAMAGE_ALL:1,DURABILITY:1
#   ARROW|amount:1-2                  fixed number or min-max (also written 1..2)
#   ENDER_PEARL|chance:15             percent chance to actually give it
#   STICK|KNOCKBACK:2|keep:40|amount:1
#   chance and keep are out of 100.
# Items without their own amount use items.default-amount, except the blocks pool,
# which uses block-min and block-max unless items.amounts (or amount:) sets one.
items:
  # Stack size for weapons, armor, and chaos items that do not set an amount.
  default-amount: 1
  # Per-material amounts. These override block-min/block-max and default-amount.
  # A line's amount: still wins over this map.
  amounts:
    OBSIDIAN: "1-2"
    ARROW: "1-2"
    SNOW_BALL: "1-2"
    TNT: "1"
    ENDER_PEARL: "1"
    # Logs stay below block-min so a log stack is smaller than any other block stack.
    LOG: "1-3"
  # Per-material chance to give the item at all. Missing entries are 100, except ender pearls, which use pearl-chance.
  chances:
    ENDER_PEARL: 15
  # Default chance to keep a rolled enchantment instead of the fallback item.
  enchant-keep-chance: 12
  # Per-material override of that chance.
  enchant-keep:
    STICK: 12
  # Enchants applied when the pool line itself does not list any.
  # Use Bukkit 1.8 enchantment names.
  enchants:
    STICK:
      - KNOCKBACK:1
  # Item given when an enchantment roll fails.
  enchant-fallback:
    weapons: WOOD_SWORD
    armor: LEATHER_HELMET
    blocks: COBBLESTONE
    chaos: COBBLESTONE
  # Weapon pool. Duplicate lines are extra copies in the random draw.
  weapons:
    - WOOD_SWORD
    - WOOD_SWORD
    - STONE_SWORD
    - STONE_SWORD
    - GOLD_SWORD
    - IRON_SWORD
    - WOOD_AXE
    - STONE_AXE
    - IRON_AXE
    - BOW
    - BOW
