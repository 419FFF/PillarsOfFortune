# Pillars of Fortune
# Edit this file, then run /pof reload. A restart is only needed when the note in chat says so.
#
# config-version is how far this file has been upgraded.
# DO NOT CHANGE config-version. On startup and /pof reload the plugin walks an older
# number forward to this jar's version, keeps your values, and writes config.yml.vN.bak first.
config-version: 20

# Chat prefix placed in front of plugin messages. Use & color codes.
prefix: "&8[&6PoF&8]&r"
# Text shown on the sidebar and the tab footer. Use your own address.
server-ip: example.com

worlds:
  # Existing lobby world. Pillars are never built here, and this world is never recreated.
  lobby-name: world
  # Void world used for matches. Created on startup if it does not exist.
  game-name: pof_void
  # When true, the lobby weather is cleared every 10 seconds. The game world is always kept clear.
  clear-lobby-weather: false

arenas:
  # How many arenas to prepare. Each id gets its own spot on a spiral, using both +X/-X and +Z/-Z.
  # Spots that would cross the vanilla world border (±30,000,000) are skipped.
  count: 6
  # Blocks between arena centers. Raised automatically if it is too small for the reset boxes to overlap.
  # Changing this does not move arenas that already exist until a restart.
  spacing: 2000
  # region: clear that arena's box inside the shared void world, then rebuild its pillars.
  # world-per-arena: unload that arena's own void world, delete it, and create a fresh one.
  reset-mode: region
  # How many blocks to edit each tick while clearing, so the server does not freeze.
  # Higher finishes a reset sooner. 20000 clears a full arena in a few seconds on a 20 TPS server.
  reset-blocks-per-tick: 20000
  # Horizontal reach of a reset, measured from the arena center.
  # The plugin also makes sure this is larger than the build radius, border, and clear radius.
  # The wipe runs from the bottom of the world (Y=0) up to just above max-build-y and the pillars,
  # never the whole world height, so it stays quick.
  reset-radius: 96

pillars:
  # How many bedrock pillars to build. Players are capped at this number as well.
  count: 12
  # Used only when count is higher than the offset list. Extra pillars sit on a circle of this radius.
  radius: 20
  # Height of each bedrock pillar, ending at y.
  height: 45
  # Top block of every pillar, and the Y the cages sit on.
  y: 70
  # X,Z offsets from the arena center. The first 12 match the original layout.
  offsets:
    - "20,0"
    - "17,10"
    - "10,17"
    - "0,20"
    - "-10,17"
    - "-17,10"
    - "-20,0"
    - "-17,-10"
    - "-10,-17"
    - "0,-20"
    - "10,-17"
    - "17,-10"

# Players below this Y are eliminated, in addition to anyone who leaves the border.
void-y: 8
# Kept from the original options list. Spacing between arenas is arenas.spacing, not this value.
arena-size: 40
# How far from the center, on X or Z, a living player may place blocks.
build-radius: 48
# Older clear distance. Reset uses arenas.reset-radius and is forced to stay larger than this.
clear-radius: 72
# No longer the height of a reset. Resets always clear from the bottom of the world to the top.
clear-height: 120
# Players above this Y cannot place blocks.
max-build-y: 120
# Distance from the arena center at which a living player is eliminated.
border-kill: 70
# If a player falls into the void or past the border within this many seconds of being hit,
# the last player who hit them gets the kill. 0 disables that credit.
void-credit-seconds: 10

# Queue will not start a match until at least this many people are waiting.
min-players: 2
# Most players taken from the queue into one match. Also limited by pillars.count.
max-players: 12
# Seconds the cages stay closed after the match is assigned.
countdown: 10
# Seconds to wait in queue once enough players are ready. VIP /pof start can cut this to 5.
queue-seconds: 30
# How often the "waiting for players" reminder repeats to a short queue, in seconds.
queue-reminder-seconds: 20
# How often the "you are alone" line repeats, in seconds. Kept higher so it is not spammy.
queue-alone-seconds: 60
# Seconds-left values that send the "starting soon" line to everyone in that queue.
queue-broadcast-seconds: [30, 20, 10, 5]
# Seconds between item drops after the first one. Sudden death shortens this to 2 seconds.
item-seconds: 5
# Seconds after the cages open before the first items are given. 0 gives an item immediately.
item-delay-seconds: 3
# Seconds at the start of a round with no damage.
grace-seconds: 5
# Seconds to show the winner before players return to the lobby and the arena is wiped.
end-seconds: 8
# After this many seconds the round goes to sudden death: faster items and lightning on pillars.
max-game-seconds: 600
# Gamemode used in the lobby and inside closed cages. Use a Bukkit name such as ADVENTURE or SURVIVAL.
lobby-gamemode: ADVENTURE

# Queues players can join. A mode listed here is on unless enabled is set to false.
# One enabled mode is what /pof join and the queue item use. Two or more open a chest menu.
# Leave min-players, max-players, countdown, queue-seconds, or item-delay-seconds out to use the global values.
# random-items: false stops the random drops; start-items: gives an exact kit when the cages close.
gamemodes:
  # Default mode. Random items the whole round.
  classic:
    enabled: true
    name: "&6Classic"
    icon: BEDROCK
    description:
      - "&7The original Pillars of Fortune."
      - "&7Random items the whole round."
      - "&7Last player standing wins."
  # Pure PvP. Everyone starts fully geared and no random items follow.
  rush:
    enabled: true
    name: "&cRush"
    icon: DIAMOND_SWORD
    description:
      - "&7Pure PvP - no random items."
      - "&7Everyone starts with diamond armor,"
      - "&7an iron sword, blocks, and tools."
    min-players: 2
    max-players: 12
    random-items: false
    start-items:
      - DIAMOND_HELMET
      - DIAMOND_CHESTPLATE
      - DIAMOND_LEGGINGS
      - DIAMOND_BOOTS
      - IRON_SWORD
      - "COBBLESTONE|amount:64"
      - "COBBLESTONE|amount:64"
      - FISHING_ROD
      - "WOOD|amount:64"
      - "WOOD|amount:64"
      - WATER_BUCKET
      - WOOD_AXE
      - WOOD_PICKAXE
      - "GOLDEN_APPLE|amount:3"
  # Example of a lower-player mode. Set enabled to true to show it in the mode menu.
  custom:
    enabled: false
    name: "&bCustom"
    icon: DIAMOND
    description:
      - "&7An example mode you can edit."
    min-players: 2
    max-players: 8
    countdown: 10
    item-delay-seconds: 5

# Fire charges thrown by living players during a round.
# Right-click launches a fireball along the crosshair. The push, the damage, and the way the blast
# scales with jumping match the bedwars1058 fork. Vanilla explosion damage is cancelled.
fireball:
  # Blocks per tick along the look direction. bedwars1058 calls this speed-multiplier (default 10).
  speed: 10.0
  # Horizontal push away from the blast. bedwars1058 default is 1.0.
  knockback-horizontal: 1.0
  # Upward pop. A jumping player is pushed higher. bedwars1058 default is 0.65.
  knockback-vertical: 0.65
  # Players inside this many blocks of the blast are affected. bedwars1058 default is 3.
  radius: 3.0
  # Seconds before the same player can throw another charge.
  cooldown: 0.5
  # Hearts are half this number. 2.0 is one heart.
  damage-self: 2.0
  damage-enemy: 2.0
  # When false, the blast does not set blocks on fire.
  fire: false
  # How strongly the blast breaks blocks. bedwars1058 uses its explosion size here (default 3).
  yield: 3.0

# Default stack size for a block-pool item that has no items.amounts entry.
# The roll is weighted toward the low end, same shape as the original script, scaled to this range.
block-min: 4
block-max: 12
# Chance, out of 100, to actually give an ender pearl when one is rolled.
# Overridden by items.chances.ENDER_PEARL when that key is set.
pearl-chance: 15
# Chance, out of 100, to keep an enchantment that was rolled. Otherwise the fallback item is given.
# items.enchant-keep-chance and items.enchant-keep override this.
enchant-keep-chance: 12

# Relative weight of each item category. They do not have to add up to 100.
# A category with a higher number is rolled more often.
rates:
  weapons: 8
  armor: 7
  blocks: 72
  chaos: 13

# Leveling, modeled on BedWars1058. XP fills the bar and the level, and rankups cost more.
leveling:
  enabled: true
  # Used where {level_name} appears. {level} is the number.
  level-format: "&e{level}"
  # XP sources. A win also adds winstreak-step for each extra win in a row, up to winstreak-cap.
  xp-per-win: 100
  xp-per-kill: 10
  xp-per-game: 5
  xp-per-minute: 2
  # Win bonus per extra win in a row, and the most that bonus can ever be.
  winstreak-step: 10
  winstreak-cap: 100
  # Each level costs rankup-growth times the one before, so it keeps getting harder, and the cost
  # never passes rankup-cap. Level 1 costs rankup-base.
  rankup-base: 500
  rankup-growth: 1.15
  rankup-cap: 20000
  progress-bar:
    length: 20
    symbol: "|"
    unlocked-color: "&b"
    locked-color: "&7"
  # Optional overrides. An exact level wins, then a from-to range; everything else uses the curve.
  # rankups:
  #   1: 500
  #   50-99: 5000

# Items given in the lobby. Materials are Bukkit 1.8 names. Names support & colors.
lobby-items:
  # Slot 0. Right-click or /pof join.
  join-material: NETHER_STAR
  join-name: "&6&lJoin Queue"
  # Slot 8 while queued.
  leave-material: BARRIER
  leave-name: "&c&lLeave Queue"
  # Slot 4 for players with slop.pof.vip. Right-click skips the queue timer to 5 seconds.
  vip-material: DIAMOND
  vip-name: "&6&lStart Match"
  # Slot 8 while you are out of the queue. Runs the command as the player. Off by default.
  hub-enabled: false
  hub-material: BED
  hub-name: "&a&lHub"
  hub-command: "hub"

# Lobby visibility toggle. Right-click the dye in your hotbar to cycle the three states.
visibility:
  # Hotbar slot. 7 is the 8th slot. Slot 8 is the 9th and holds the leave item while queued.
  slot: 7
  item: INK_SACK
  # Dye data values on 1.8: 0 ink sac, 1 red, 2 green, 4 lapis, 10 lime, 11 yellow, 15 bone meal.
  dye-all: 10
  dye-queue: 11
  dye-none: 8
  # true shows everyone until the player changes it. false hides everyone by default.
  show-all-by-default: true

# Wins, kills, and the other stats. h2 needs no extra setup. mysql uses the host below.
# Changing these and running /pof reload reconnects. Tables are not deleted.
storage:
  # h2 or mysql
  type: h2
  h2:
    # File name inside the plugin folder. The .mv.db suffix is added by H2.
    file: data
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    user: root
    password: ""

leaderboards:
  # How many names /pof top and %pof_top_<n>_name% return.
  size: 10
  # How often the cached top list is re-read from SQL. 20 ticks is one second. A win refreshes it immediately.
  refresh-ticks: 200

stats:
  # true: +1 playtime minute per minute online. false: only while the player is in a match.
  playtime-online-only: true

# 1.8 sound names, played with the pitches from the original mode.
sounds:
  queue-join: random.orb
  countdown: note.pling
  eliminated: mob.wither.hurt
  victory: random.levelup
  defeat: random.explode
  cages: mob.wither.spawn
  fight: random.levelup
  item: random.pop
  kill: random.orb
  fireball: mob.ghast.fireball

