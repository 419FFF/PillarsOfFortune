  elim-void: "&e{player} &7fell into the void."
  # Used instead of elim-void when someone else knocked them off. {player} and {killer}.
  elim-void-kill: "&e{player} &7was knocked into the void by &c{killer}"
  elim-leave: "&e{player} &7forfeited."
  elim-death: "&e{player} &7was eliminated."
  slain: "&e{victim} &7was slain by &c{killer}"
  title-eliminated: "&cELIMINATED"
  subtitle-eliminated: "&7You are spectating"
  no-winner: "&cNo winner. The pillars are empty."
  title-draw: "&7DRAW"
  subtitle-draw: "&8No one remained"
  title-victory: "&6&lVICTORY"
